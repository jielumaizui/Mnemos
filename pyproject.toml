[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemos"
version = "2.0.0"
description = "Local AI Agent knowledge capture, distillation, search and action assistance system"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mnemos Contributors"}]
keywords = ["knowledge-management", "ai-agent", "second-brain", "llm", "wiki", "obsidian"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23.0,<5",
    "watchdog>=3.0.0,<7",
    "numpy>=1.24.0,<2",
    "pandas>=1.5.0,<3",
    "openpyxl>=3.0.0,<4",
    "python-pptx>=1.0.0,<2",
    "pypdf>=6.14.2,<7",
    "python-docx>=1.0.0,<2",
    "beautifulsoup4>=4.11.0,<5",
    "markdownify>=0.11.0,<1",
    "ebooklib>=0.18.0,<1",
    "openai>=1.0.0,<2",
    "anthropic>=0.30.0,<1",
    "keyring>=25.0.0,<26",
    "pdfplumber>=0.11.0,<1",
    "psutil>=5.9.0,<7",
    "tomli>=2.0.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0,<2"]
kimi = ["tomli_w>=1.0.0,<2"]
ml = ["scikit-learn>=1.3.0,<2", "hnswlib>=0.8.0,<1"]
encryption = ["cryptography>=48.0.1,<50"]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=7.0.0,<8", "black>=26.3.1,<27", "flake8>=6.0.0,<8", "mypy>=2.1.0,<2.2", "hnswlib>=0.8.0,<1", "networkx>=3.0,<4", "vulture>=2.11,<3", "bandit>=1.7.0,<2", "pip-audit>=2.7.0,<3", "cryptography>=48.0.1,<50"]
all = ["mcp>=1.0.0,<2", "tomli_w>=1.0.0,<2", "scikit-learn>=1.3.0,<2", "hnswlib>=0.8.0,<1", "tiktoken>=0.7.0,<1", "cryptography>=48.0.1,<50"]

[project.scripts]
mnemos = "mnemos_cli:main"

[project.urls]
Homepage = "https://github.com/jielumaizui/mnemos"
Documentation = "https://github.com/jielumaizui/mnemos/blob/main/README.md"

[tool.setuptools.packages.find]
include = ["core*", "daemon*", "integrations*", "scripts*", "prompts*", "config*"]

[tool.setuptools]
py-modules = ["mnemos_cli", "mnemos_daemon"]

[tool.setuptools.package-data]
core = ["*.json"]
config = [".env.example", "*.json", "*.yaml"]
prompts = ["*.md", "distill/**/*.md", "distill/**/*.json"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "no_canonical_material_actions: exercise a material sink without an upstream DecisionTrace scope",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
exclude = ["docs/demo"]

[tool.vulture]
exclude = [".venv", "__pycache__", ".git", ".pytest_cache", ".mypy_cache", ".audit_venv", "build/", "dist/"]
paths = [".", "vulture_whitelist.py"]
