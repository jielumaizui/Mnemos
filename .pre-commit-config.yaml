# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: "^(.venv|__pycache__|.git|.pytest_cache|.mypy_cache|build/|dist/|docs/demo)/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Local hooks reuse the project's own venv tooling.
  # Make sure you have run `pip install -e ".[dev]"` and are inside the venv.
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: python -m flake8 --count
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy-budget
        name: mypy budget gate
        entry: python scripts/mypy_budget.py
        language: system
        pass_filenames: false
        always_run: true

      - id: compileall
        name: compileall
        entry: python -m compileall -q core/ integrations/ daemon/ scripts/ mnemos_cli.py mnemos_daemon.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-bare-except
        name: check bare except blocks
        entry: python scripts/check_bare_except.py
        language: system
        pass_filenames: false
        always_run: true

      - id: maintainability-budget
        name: maintainability ratchet and accepted-debt closure
        entry: python scripts/check_maintainability_budget.py --closure
        language: system
        pass_filenames: false
        always_run: true

      - id: config-examples
        name: config examples strict coverage
        entry: python3 scripts/verify_config_examples.py --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: config-registry-closure
        name: canonical config registry closure
        entry: python3 scripts/audit_config_registry_closure.py --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: relation-evidence-schema-registry
        name: relation evidence schema registry
        entry: python3 scripts/audit_schema_registry.py --strict --json
        language: system
        pass_filenames: false
        always_run: true

      - id: cognitive-state-store-contract
        name: cognitive state store contract
        entry: python3 scripts/audit_cognitive_state_store.py --strict --json
        language: system
        pass_filenames: false
        always_run: true

      - id: cognitive-search-contract
